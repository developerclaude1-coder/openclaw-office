<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Scanly — scan documents with your phone, crop, enhance and export to PDF." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scanly" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Scanly — Document Scanner</title>
  </head>
  <body>
    <div id="app" class="app"></div>

    <!-- Hidden file inputs for camera capture and gallery import -->
    <input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment" />
    <input id="galleryInput" class="hidden-input" type="file" accept="image/*" multiple />

    <script type="module" src="./js/app.js"></script>
    <script>
      // Register the service worker for offline / installable PWA behaviour.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            /* offline support is best-effort */
          });
        });
      }
    </script>
  </body>
</html>
