# Run Scanly on your server VM:
#
#   HTTP only (testing / behind another proxy):
#     docker compose up -d scanly
#     -> http://<vm-host>:8080/
#
#   HTTPS for phone use (camera needs HTTPS) — set your domain first:
#     export SCANLY_DOMAIN=scan.example.com   # must point (DNS A record) at this VM
#     docker compose --profile tls up -d
#     -> https://scan.example.com/   (Caddy fetches a real cert automatically)
#
services:
  scanly:
    build: .
    image: scanly:latest
    restart: unless-stopped
    ports:
      - "${SCANLY_HTTP_PORT:-8080}:80"

  # Optional TLS terminator. Enable with:  --profile tls
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on: [scanly]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SCANLY_DOMAIN: ${SCANLY_DOMAIN:?set SCANLY_DOMAIN to your VM's domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
