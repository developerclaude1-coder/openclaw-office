# nginx config for serving the Scanly PWA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Correct MIME types (nginx's defaults miss .webmanifest / .mjs).
  types {
    text/html                 html;
    text/javascript           js mjs;
    text/css                  css;
    application/manifest+json webmanifest;
    application/json          json;
    image/svg+xml             svg;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/x-icon              ico;
  }
  default_type application/octet-stream;

  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 512;

  # The service worker and app shell must never be cached stale, so updates
  # reach installed PWAs immediately.
  location = /sw.js            { add_header Cache-Control "no-cache"; }
  location = /index.html       { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Other static assets can be cached briefly.
  location / {
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ /index.html;
  }
}
