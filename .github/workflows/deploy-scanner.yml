name: Deploy Scanly (iscanner) to GitHub Pages

# Publishes the self-contained document-scanner PWA in ./iscanner to GitHub
# Pages, giving you an HTTPS URL you can open on your phone and "Add to Home
# Screen". Camera access requires HTTPS, which Pages provides.

on:
  push:
    branches:
      - claude/iscanner-app-clone-mj6rph
      - main
    paths:
      - "iscanner/**"
      - ".github/workflows/deploy-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically so the first run doesn't require the
          # repo owner to flip Settings → Pages by hand.
          enablement: true

      - name: Upload iscanner as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./iscanner

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
